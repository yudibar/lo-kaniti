<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f5ef"><link rel="manifest" href="manifest.webmanifest"><title>לא קניתי</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8f5ef;color:#24231f;font-family:system-ui,-apple-system,Arial}.app{max-width:680px;margin:auto;padding:24px 14px 70px}header{text-align:center}h1{font-size:38px;margin:5px}.muted{color:#77736d;font-size:13px}.card{background:white;border:1px solid #ebe5dc;border-radius:24px;padding:18px;margin:12px 0;box-shadow:0 10px 28px #5c49320b}input,select{width:100%;padding:14px;border:1px solid #ebe5dc;border-radius:14px;font-size:17px;margin:5px 0}.buttons,.stats,.backup{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}button{border:0;border-radius:14px;padding:13px 8px;font-weight:800}.save{background:#24755c;color:white}.wait{background:#f3e5d6}.buy,.soft{background:#efebe6}.stat{text-align:center;background:white;border:1px solid #ebe5dc;border-radius:18px;padding:13px 4px}.stat b{display:block;font-size:20px;margin-top:4px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 0;border-bottom:1px solid #eee8e1}.row:last-child{border:0}.progress{height:12px;background:#eee9e2;border-radius:99px;overflow:hidden;margin:12px 0}.bar{height:100%;background:#ef8b58}.green{color:#24755c;font-weight:800}.danger{background:none;color:#a55;padding:4px}.toast{text-align:center;color:#24755c;min-height:20px;margin-top:7px}.file{display:none}@media(max-width:470px){.buttons{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.stats .stat:first-child{grid-column:1/-1}}
</style></head><body><div class="app"><header><h1>לא קניתי 😎</h1><div class="muted">לא הוצאת כסף? הרווחת אותו למשהו שבאמת חשוב לך.</div></header>
<section class="card"><h3>מה כמעט קנית?</h3><input id="item" placeholder="למשל Wolt, חולצה, משחק..."><input id="amount" type="number" inputmode="decimal" placeholder="כמה זה עולה? ₪"><select id="cat"><option>אוכל ומשלוחים</option><option>קניות</option><option>מנויים</option><option>בילויים</option><option>טכנולוגיה</option><option>תחבורה</option><option>אחר</option></select><div class="buttons"><button class="save" onclick="add('saved')">💰 לא קניתי</button><button class="wait" onclick="add('wait')">⏳ 24 שעות</button><button class="buy" onclick="add('bought')">🛒 קניתי</button></div><div id="toast" class="toast"></div></section>
<section class="stats"><div class="stat"><span class="muted">החודש</span><b id="month">₪0</b></div><div class="stat"><span class="muted">סה״כ</span><b id="total">₪0</b></div><div class="stat"><span class="muted">קצב שנתי</span><b id="year">₪0</b></div></section>
<section class="card"><h3>📱 היעד שלי: <span id="gname">אייפון חדש</span></h3><div class="progress"><div id="bar" class="bar"></div></div><div id="gstatus" class="green"></div><details><summary class="muted">שינוי יעד</summary><input id="ng" placeholder="שם יעד"><input id="np" type="number" placeholder="מחיר"><button class="soft" onclick="goal()">עדכון</button></details></section>
<section class="card"><h3>⏳ מחכה למחר</h3><div id="waiting"></div></section><section class="card"><h3>🏆 מאיפה חסכתי?</h3><div id="cats"></div></section><section class="card"><h3>📜 פעילות</h3><div id="history"></div></section>
<section class="card"><h3>🛟 גיבוי</h3><div class="backup" style="grid-template-columns:1fr 1fr"><button class="soft" onclick="exp()">ייצוא</button><button class="soft" onclick="document.getElementById('file').click()">שחזור</button></div><input class="file" id="file" type="file" accept="application/json"></section></div>
<script>
const K='loKanitiV1',f=n=>new Intl.NumberFormat('he-IL',{style:'currency',currency:'ILS',maximumFractionDigits:0}).format(n||0),$=x=>document.getElementById(x);let S=JSON.parse(localStorage.getItem(K)||'null')||{events:[],waiting:[],goal:{name:'אייפון חדש',price:3600}};const save=()=>localStorage.setItem(K,JSON.stringify(S)),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2);
function vals(){return{item:$('item').value.trim()||'קנייה',amount:+$('amount').value,cat:$('cat').value}}function add(t){let v=vals();if(!v.amount)return $('toast').textContent='צריך להכניס סכום 🙂';if(t==='wait'){S.waiting.unshift({...v,id:uid(),due:Date.now()+864e5});$('toast').textContent='נחכה למחר ⏳'}else{S.events.unshift({...v,id:uid(),type:t,ts:Date.now()});$('toast').textContent=t==='saved'?f(v.amount)+' נשארו אצלך 🎉':'נרשם 🙂'}$('item').value='';$('amount').value='';save();render()}
function render(){let E=S.events.filter(x=>x.type==='saved'),tot=E.reduce((s,x)=>s+x.amount,0),d=new Date(),m=E.filter(x=>{let z=new Date(x.ts);return z.getMonth()==d.getMonth()&&z.getFullYear()==d.getFullYear()}).reduce((s,x)=>s+x.amount,0),first=E.length?Math.min(...E.map(x=>x.ts)):Date.now(),days=Math.max(1,(Date.now()-first)/864e5+1),yr=tot/days*365;$('month').textContent=f(m);$('total').textContent=f(tot);$('year').textContent=f(yr);$('gname').textContent=S.goal.name;let p=Math.min(100,tot/S.goal.price*100);$('bar').style.width=p+'%';$('gstatus').textContent=p>=100?'הגעת ליעד! 🎉':p.toFixed(0)+'% בדרך · נשארו '+f(S.goal.price-tot);
$('waiting').innerHTML=S.waiting.length?S.waiting.map(w=>`<div class="row"><div><b>${w.item}</b><div class="muted">${f(w.amount)} · ${Math.max(0,Math.ceil((w.due-Date.now())/36e5))} שעות</div></div><div><button class="save" onclick="resolveW('${w.id}','saved')">ויתרתי</button> <button class="buy" onclick="resolveW('${w.id}','bought')">קניתי</button></div></div>`).join(''):'<div class="muted">אין קניות בהמתנה 👌</div>';let C={};E.forEach(x=>C[x.cat]=(C[x.cat]||0)+x.amount);$('cats').innerHTML=Object.entries(C).sort((a,b)=>b[1]-a[1]).map(x=>`<div class="row"><span>${x[0]}</span><b>${f(x[1])}</b></div>`).join('')||'<div class="muted">עוד אין נתונים.</div>';$('history').innerHTML=S.events.slice(0,15).map(x=>`<div class="row"><div><b>${x.item}</b><div class="muted">${x.cat} · ${new Date(x.ts).toLocaleDateString('he-IL')}</div></div><div>${x.type==='saved'?'💰':'🛒'} ${f(x.amount)} <button class="danger" onclick="del('${x.id}')">×</button></div></div>`).join('')||'<div class="muted">עוד אין פעילות.</div>'}
function resolveW(id,t){let w=S.waiting.find(x=>x.id===id);S.waiting=S.waiting.filter(x=>x.id!==id);S.events.unshift({...w,id:uid(),type:t,ts:Date.now()});save();render()}function del(id){S.events=S.events.filter(x=>x.id!==id);save();render()}function goal(){let n=$('ng').value.trim(),p=+$('np').value;if(n)S.goal.name=n;if(p)S.goal.price=p;save();render()}
function exp(){let b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='lo-kaniti-backup.json';a.click()}
$('file').onchange=async e=>{try{S=JSON.parse(await e.target.files[0].text());save();render();$('toast').textContent='הגיבוי שוחזר ✅'}catch{$('toast').textContent='קובץ לא תקין'}};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script></body></html>
